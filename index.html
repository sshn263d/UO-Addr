<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK Express URL Generator</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#143b45;background:#f3f7ec}*{box-sizing:border-box}body{margin:0;padding:24px 14px}main{max-width:760px;margin:32px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 36px #15384018}header{background:#005c78;color:white;padding:24px 28px}h1{font-size:1.5rem;margin:0 0 5px}header p{margin:0;color:#d9eaf0;font-size:.9rem}.body{padding:24px 28px}.trip{display:flex;gap:8px;margin-bottom:24px}.trip label{flex:1;text-align:center;padding:11px 5px;border:1px solid #bed1d2;border-radius:9px;cursor:pointer;font-size:.93rem}.trip label:has(input:checked){background:#005c78;color:white;border-color:#005c78}.trip input{position:absolute;opacity:0;pointer-events:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label.field{display:block;font-weight:600;font-size:.88rem}select,input[type=date],input[type=number]{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #c4d1d5;border-radius:8px;background:#fff;color:#203d44;font:inherit;min-width:0}select:focus,input:focus{outline:2px solid #69aab6;outline-offset:1px}h2{font-size:1rem;margin:4px 0 16px;color:#005c78}.section{margin:0 0 20px}.secondary{padding-top:16px;border-top:1px solid #e0e9e8}.bottom{margin-top:18px}.primary{width:100%;padding:13px;border:0;border-radius:9px;background:#e88d67;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}.primary:hover{background:#d37354}.result{margin-top:18px;padding:16px;border:1px solid #d5e2df;border-radius:10px;background:#f5faf8;display:none;overflow-wrap:anywhere}.result p{font-size:.86rem;margin:0 0 9px}.result a{color:#005c78}.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.small{border:1px solid #b7c8c8;background:white;color:#005c78;border-radius:7px;padding:9px 13px;cursor:pointer}details{margin-top:16px;color:#46646b;font-size:.9rem}details summary{cursor:pointer}#legacyArea{margin-top:12px;overflow-wrap:anywhere;font-size:.83rem}#message{min-height:1.4em;margin-top:10px;font-size:.87rem;color:#005c78}@media(max-width:560px){body{padding:12px}main{margin:8px auto}header,.body{padding:20px}.grid{grid-template-columns:1fr}.trip{gap:5px}.trip label{font-size:.82rem;padding:11px 4px}}
</style>
</head>
<body><main><header><h1>HK Express URL Generator</h1><p>快速產生航班搜尋連結</p></header><div class="body">
<div class="trip" role="radiogroup" aria-label="行程類型">
<label><input type="radio" name="trip" value="oneWay">單程</label>
<label><input type="radio" name="trip" value="roundTrip" checked>來回</label>
<label><input type="radio" name="trip" value="multiCity">Open Jaw</label>
</div>
<form id="form"><section class="section"><h2 id="leg1Title">去程</h2><div class="grid">
<label class="field">出發機場<select id="origin1" required></select></label>
<label class="field">抵達機場<select id="destination1" required></select></label>
<label class="field">出發日期<input type="date" id="date1" required></label>
</div></section>
<section id="leg2" class="section secondary"><h2 id="leg2Title">回程</h2><div class="grid"><label class="field" id="origin2Wrap">出發機場<select id="origin2"></select></label><label class="field" id="destination2Wrap">抵達機場<select id="destination2"></select></label><label class="field">回程日期<input type="date" id="date2"></label></div></section>
<div class="bottom"><label class="field">成人數目<input type="number" id="adults" min="1" max="9" value="1" required></label></div>
<div class="bottom"><button class="primary" type="submit">產生網址並複製</button></div></form>
<div id="message" role="status" aria-live="polite"></div><div class="result" id="result"><p><strong>mybooking.hkexpress.com</strong>（預設）</p><a id="newLink" target="_blank" rel="noopener noreferrer"></a><div class="actions"><button class="small" id="copyBtn" type="button">複製網址</button><a id="openLink" target="_blank" rel="noopener noreferrer">開啟搜尋</a></div></div>
<details><summary>進階選項：舊版 booking.hkexpress.com</summary><div id="legacyArea">產生連結後顯示。</div></details>
</div></main>
<script>
'use strict';
const regions={
'香港':[['香港','HKG']],
'中國大陸':[['北京（大興）','PKX'],['寧波','NGB'],['三亞','SYX']],
'日本':[['福岡','FUK'],['廣島','HIJ'],['鹿兒島','KOJ'],['名古屋','NGO'],['沖繩','OKA'],['大阪（關西）','KIX'],['仙台','SDJ'],['高松','TAK'],['東京（所有機場）','TYO'],['東京（羽田）','HND'],['東京（成田）','NRT']],
'韓國':[['釜山','PUS'],['濟州','CJU'],['首爾（仁川）','ICN']],
'中國台灣':[['花蓮','HUN'],['高雄','KHH'],['台中','RMQ'],['台北','TPE']],
'馬來西亞':[['檳城','PEN']],
'泰國':[['曼谷（所有機場）','BKK'],['曼谷（廊曼）','DMK'],['曼谷（蘇凡納布米）','BKK'],['清邁','CNX'],['布吉','HKT']],
'越南':[['峴港','DAD'],['河內','HAN'],['富國島','PQC']],
'菲律賓':[['克拉克','CRK'],['馬尼拉','MNL']]};
const $=id=>document.getElementById(id);
for(const id of ['origin1','destination1','origin2','destination2']){
 const sel=$(id);for(const [region,airports] of Object.entries(regions)){const group=document.createElement('optgroup');group.label=region;for(const [name,code] of airports){const opt=document.createElement('option');opt.value=code;opt.textContent=`${name} (${code})`;group.append(opt)}sel.append(group)}
}
$('origin1').value='HKG';$('destination1').value='TPE';$('origin2').value='TPE';$('destination2').value='HKG';
const mode=()=>document.querySelector('input[name="trip"]:checked').value;
function updateMode(){const m=mode();$('leg2').hidden=m==='oneWay';$('origin2Wrap').hidden=m!=='multiCity';$('destination2Wrap').hidden=m!=='multiCity';$('origin2').required=m==='multiCity';$('destination2').required=m==='multiCity';$('date2').required=m!=='oneWay';$('leg2Title').textContent=m==='multiCity'?'第二航段':'回程';$('leg1Title').textContent=m==='multiCity'?'第一航段':'去程';$('result').style.display='none';$('message').textContent='';}
function updateDate(){const d=$('date1').value; if(!d){$('date2').min='';return}const date=new Date(d+'T12:00:00');date.setDate(date.getDate()+1);const next=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');$('date2').min=next;if($('date2').value&&$('date2').value<=d)$('date2').value='';}
for(const r of document.querySelectorAll('input[name="trip"]'))r.addEventListener('change',updateMode);$('date1').addEventListener('change',updateDate);updateMode();
const oldDate=s=>{const [y,m,d]=s.split('-');return `${Number(d)}/${Number(m)}/${y}`};
function buildUrl(host,m,fields){const {a,b,c,d,date1,date2,adults}=fields;if(host==='new'){
 const params=new URLSearchParams();params.set('SearchType',m);params.set('Adults',adults);params.set('currency','HKD');
 if(m==='multiCity'){params.set('DepartureDate',date1);params.set('ReturnDate',date2);params.set('multioriginstation1',a);params.set('multidestinationstation1',b);params.set('multioriginstation2',c);params.set('multidestinationstation2',d)}else{params.set('OriginStation',a);params.set('DestinationStation',b);params.set('DepartureDate',date1);if(m==='roundTrip')params.set('ReturnDate',date2)}
 return 'https://mybooking.hkexpress.com/zh-HK/flight-booking/select?'+params.toString();}
 const params=new URLSearchParams();params.set('SearchType',m==='roundTrip'?'RETURN':m==='oneWay'?'ONEWAY':'MULTICITY');
 if(m==='multiCity'){params.set('multioriginstation1',a);params.set('multidestinationstation1',b);params.set('multioriginstation2',c);params.set('multidestinationstation2',d)}else{params.set('OriginStation',a);params.set('DestinationStation',b)}
 params.set('DepartureDate',oldDate(date1));if(m!=='oneWay')params.set('ReturnDate',oldDate(date2));params.set('Adults',adults);params.set('rediscoverbooking','false');params.set('currency','HKD');return 'https://booking.hkexpress.com/zh-hk/select/?'+params.toString();}
let current='';
async function copy(text){try{await navigator.clipboard.writeText(text);$('message').textContent='已自動複製網址。'}catch{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();try{if(document.execCommand('copy'))$('message').textContent='已複製網址。';else $('message').textContent='無法自動複製，請手動複製下方網址。'}catch{$('message').textContent='無法自動複製，請手動複製下方網址。'}el.remove();}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const m=mode();const fields={a:$('origin1').value,b:$('destination1').value,c:m==='roundTrip'?$('destination1').value:$('origin2').value,d:m==='roundTrip'?$('origin1').value:$('destination2').value,date1:$('date1').value,date2:$('date2').value,adults:$('adults').value};if(fields.a===fields.b||(m==='multiCity'&&fields.c===fields.d)){$('message').textContent='同一航段的出發與抵達機場不可相同。';return}if(m!=='oneWay'&&(!fields.date2||fields.date2<=fields.date1)){$('message').textContent='回程／第二航段日期必須遲過第一航段日期。';return}
 current=buildUrl('new',m,fields);$('newLink').href=current;$('newLink').textContent=current;$('openLink').href=current;$('result').style.display='block';const legacy=buildUrl('old',m,fields);$('legacyArea').replaceChildren();const a=document.createElement('a');a.href=legacy;a.target='_blank';a.rel='noopener noreferrer';a.textContent=legacy;$('legacyArea').append(a);if(m==='multiCity'){$('legacyArea').append(document.createElement('p')).textContent='注意：舊版網站 Multi-City 參數格式未經驗證。'}await copy(current)});
$('copyBtn').addEventListener('click',()=>current&&copy(current));
</script></body></html>
