<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK Express 訂票網址產生器</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--ink:#172638;--muted:#607184;--line:#dce4ed;--orange:#e74b1a}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);padding:clamp(16px,4vw,48px)}main{width:min(100%,770px);margin:auto}.heading{margin:0 0 5px;font-size:clamp(23px,4vw,30px);letter-spacing:-.6px}.sub{color:var(--muted);margin:0 0 22px;font-size:14px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(17px,4vw,30px);box-shadow:0 12px 30px #1b36500c}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;gap:4px;background:#eef2f7;border-radius:12px;margin-bottom:22px}.tabs label{cursor:pointer;text-align:center;padding:12px 4px;border-radius:9px;font-weight:650;font-size:14px}.tabs input{position:absolute;opacity:0;pointer-events:none}.tabs label:has(input:checked){background:#fff;color:#b73c19;box-shadow:0 2px 7px #00000015}.segment{border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:15px}.segment h2{margin:0 0 15px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{min-width:0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}select,input[type=date],input[type=number]{display:block;width:100%;min-width:0;height:46px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;font:inherit;font-size:15px;color:var(--ink);background:#fff}select:focus,input:focus{outline:2px solid #ee997b;outline-offset:1px}.meta{display:flex;align-items:end;gap:14px;margin:12px 0 20px}.meta .field{width:145px}.currency{font-size:13px;color:var(--muted);padding-bottom:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.buttonlink{font:inherit;font-weight:650;font-size:14px;border-radius:10px;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}button.primary{background:var(--orange);color:#fff;border:1px solid var(--orange);flex:1}button.secondary,.buttonlink{background:#fff;color:var(--ink);border:1px solid #cbd5e1}.buttonlink{word-break:normal}.results{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.results h2{font-size:16px;margin:0 0 12px}.url{padding:12px;background:#f5f7fa;border:1px solid var(--line);border-radius:9px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;margin:8px 0}.caption{font-size:12px;color:var(--muted);margin:13px 0 5px}.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.message{font-size:13px;margin:12px 0 0;min-height:18px;color:#286b50}.warning{color:#855415;background:#fff8e9;border-radius:8px;padding:11px;font-size:13px;margin:11px 0}.error{color:#ba2929}.hidden{display:none!important}@media(max-width:550px){.grid{grid-template-columns:1fr}.segment{padding:14px}.tabs label{font-size:13px;padding:11px 2px}.actions button{width:100%}.result-actions>*{flex:1}}
</style>
</head>
<body><main><h1 class="heading">HK Express 網址產生器</h1><p class="sub">選擇航段及日期，一鍵產生並複製訂票網址。</p><section class="panel"><div class="tabs" role="radiogroup" aria-label="行程類型"><label><input type="radio" name="trip" value="oneWay">單程</label><label><input type="radio" name="trip" value="return" checked>來回</label><label><input type="radio" name="trip" value="multiCity">Open Jaw</label></div><div id="legs"></div><div class="meta"><div class="field"><label for="adults">成人</label><input id="adults" type="number" min="1" max="9" value="1" required></div><span class="currency">貨幣：HKD</span></div><div class="actions"><button class="primary" id="generate">產生網址並複製</button></div><p id="message" class="message" role="status" aria-live="polite"></p><section id="results" class="results hidden" aria-live="polite"><h2>訂票網址</h2><p class="caption">預設 · booking.hkexpress.com</p><div id="primaryUrl" class="url"></div><div class="result-actions"><button type="button" class="secondary" id="copyPrimary">複製</button><a id="openPrimary" class="buttonlink" target="_blank" rel="noopener noreferrer">開啟</a></div><p class="caption">備用 · mybooking.hkexpress.com</p><div id="alternateUrl" class="url"></div><div class="result-actions"><button type="button" class="secondary" id="copyAlternate">複製</button><a id="openAlternate" class="buttonlink" target="_blank" rel="noopener noreferrer">開啟</a></div><p id="caution" class="warning hidden"></p></section></section></main>
<script>
'use strict';
const airports={
 '香港':[['香港','HKG']],
 '中國大陸':[['北京（大興）','PKX'],['寧波','NGB'],['三亞','SYX']],
 '日本':[['福岡','FUK'],['廣島','HIJ'],['鹿兒島','KOJ'],['名古屋','NGO'],['沖繩','OKA'],['大阪（關西）','KIX'],['仙台','SDJ'],['高松','TAK'],['東京（所有機場）','TYO'],['東京（羽田）','HND'],['東京（成田）','NRT']],
 '韓國':[['釜山','PUS'],['濟州','CJU'],['首爾（仁川）','ICN']],
 '台灣':[['花蓮','HUN'],['高雄','KHH'],['台中','RMQ'],['台北','TPE']],
 '馬來西亞':[['檳城','PEN']],
 '泰國':[['曼谷（所有機場）','BKK'],['曼谷（廊曼）','DMK'],['曼谷（蘇凡納布米）','BKK'],['清邁','CNX'],['布吉','HKT']],
 '越南':[['峴港','DAD'],['河內','HAN'],['富國島','PQC']],
 '菲律賓':[['克拉克','CRK'],['馬尼拉','MNL']]
};
const $=id=>document.getElementById(id);
const types=()=>document.querySelector('input[name=trip]:checked').value;
const airportOptions=(chosen)=>Object.entries(airports).map(([region,items])=>'<optgroup label="'+region+'">'+items.map(([name,code])=>'<option value="'+code+'" '+(chosen===code?'selected':'')+'>'+name+' ('+code+')</option>').join('')+'</optgroup>').join('');
function field(id,label,type,value){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" ${value?'value="'+value+'"':''} required></div>`}
function station(id,label,value){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${airportOptions(value)}</select></div>`}
function segment(index,origin,destination,date,label){return `<section class="segment"><h2>${label}</h2><div class="grid">${station('o'+index,'出發機場',origin)}${station('d'+index,'抵達機場',destination)}${field('date'+index,'出發日期','date',date)}</div></section>`}
let values={o1:'HKG',d1:'TPE',o2:'TPE',d2:'HKG',date1:'',date2:''};
function save(){for(const id of Object.keys(values)){if($(id))values[id]=$(id).value}}
function render(){const type=types();let html=segment(1,values.o1,values.d1,values.date1,type==='multiCity'?'航段 1':'去程');if(type!=='oneWay'){html+=type==='return'?`<section class="segment"><h2>回程</h2><div class="grid">${field('date2','回程日期','date',values.date2)}</div></section>`:segment(2,values.o2,values.d2,values.date2,'航段 2')};$('legs').innerHTML=html;const d2=$('date2');if(d2&&values.date1)d2.min=nextDate(values.date1);$('date1').addEventListener('change',()=>{values.date1=$('date1').value;if($('date2'))$('date2').min=values.date1?nextDate(values.date1):''});$('results').classList.add('hidden');$('message').textContent=''}
function nextDate(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);const date=new Date(Date.UTC(y,m-1,d+1));return date.toISOString().slice(0,10)}
function oldDate(iso){const [y,m,d]=iso.split('-');return `${Number(d)}/${Number(m)}/${y}`}
function qs(obj){return Object.entries(obj).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}
function build(type,host,origin,dest,date1,date2,adults,o2,d2){const modern=host==='mybooking.hkexpress.com';const p={};if(modern){p.SearchType=type;p.Adults=adults;p.Children=0;p.Infants=0;if(type==='multiCity'){delete p.Children;delete p.Infants;p.currency='HKD';p.homePageUrl='https://www.hkexpress.com/';p.DepartureDate=date1;p.ReturnDate=date2;p.multioriginstation1=origin;p.multidestinationstation1=dest;p.multioriginstation2=o2;p.multidestinationstation2=d2}else{p.OriginStation=origin;p.DestinationStation=dest;p.DepartureDate=date1;if(type==='return')p.ReturnDate=date2;p.currency='HKD'}return 'https://'+host+'/zh-HK/flight-booking/select?'+qs(p)}
 p.SearchType=type==='return'?'RETURN':type==='oneWay'?'ONEWAY':'multiCity';if(type==='multiCity'){p.DepartureDate=oldDate(date1);p.ReturnDate=oldDate(date2);p.multioriginstation1=origin;p.multidestinationstation1=dest;p.multioriginstation2=o2;p.multidestinationstation2=d2;p.Adults=adults;p.rediscoverbooking='false';p.currency='HKD'}else{p.OriginStation=origin;p.DestinationStation=dest;p.DepartureDate=oldDate(date1);if(type==='return')p.ReturnDate=oldDate(date2);p.Adults=adults;p.rediscoverbooking='false';p.currency='HKD'}return 'https://'+host+'/zh-hk/select/?'+qs(p)}
async function copy(value){try{await navigator.clipboard.writeText(value);return true}catch(e){const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}input.remove();return ok}}
let primary='',alternate='';
$('generate').addEventListener('click',async()=>{save();const type=types(),a=Number($('adults').value),o=values.o1,d=values.d1,d1=values.date1,d2=values.date2;if(!Number.isInteger(a)||a<1||a>9){showError('成人數目須介乎 1 至 9。');return}if(!d1||(type!=='oneWay'&&!d2)){showError('請選擇所有航段日期。');return}if(type!=='oneWay'&&d2<=d1){showError('回程／第二段日期必須遲過第一段日期。');return}if(o===d){showError('第一段出發及抵達機場不能相同。');return}if(type==='multiCity'&&values.o2===values.d2){showError('第二段出發及抵達機場不能相同。');return}primary=build(type,'booking.hkexpress.com',o,d,d1,d2,a,values.o2,values.d2);alternate=build(type,'mybooking.hkexpress.com',o,d,d1,d2,a,values.o2,values.d2);$('primaryUrl').textContent=primary;$('alternateUrl').textContent=alternate;$('openPrimary').href=primary;$('openAlternate').href=alternate;$('results').classList.remove('hidden');$('caution').classList.toggle('hidden',type!=='multiCity');$('caution').textContent='注意：booking.hkexpress.com 的 Multi-City 參數格式尚未得到確認；已按現有結構推定。mybooking.hkexpress.com 的兩航段格式則依照你提供的實例。';const ok=await copy(primary);$('message').classList.remove('error');$('message').textContent=ok?'已產生網址並自動複製預設連結。':'已產生網址，但瀏覽器限制自動複製；請使用下方複製按鈕。'});
function showError(s){$('results').classList.add('hidden');$('message').classList.add('error');$('message').textContent=s}
$('copyPrimary').addEventListener('click',async()=>{$('message').textContent=await copy(primary)?'已複製預設連結。':'無法自動複製，請手動選取網址。'});$('copyAlternate').addEventListener('click',async()=>{$('message').textContent=await copy(alternate)?'已複製備用連結。':'無法自動複製，請手動選取網址。'});document.querySelectorAll('input[name=trip]').forEach(el=>el.addEventListener('change',()=>{save();if(types()==='multiCity'&&values.o2===values.d2){values.o2=values.d1;values.d2='HKG'}render()}));render();
</script></body></html>
