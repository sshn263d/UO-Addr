<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>HK Express 訂票網址產生器</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182335; background: #f7f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(18px, 5vw, 48px) 16px; }
    main { width: min(100%, 700px); margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { font-size: clamp(1.4rem, 4vw, 1.85rem); line-height: 1.3; margin: 0 0 8px; letter-spacing: -.02em; }
    .subtitle { color: #66748b; margin: 0; font-size: .94rem; }
    .panel { background: #fff; border: 1px solid #e4e8ef; border-radius: 18px; padding: clamp(18px, 4vw, 28px); box-shadow: 0 10px 35px rgba(25,40,70,.045); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .field { min-width: 0; }
    label { display: block; font-size: .88rem; font-weight: 650; margin-bottom: 8px; }
    input, select { appearance: auto; width: 100%; min-width: 0; height: 46px; padding: 0 12px; border: 1px solid #cdd5e1; border-radius: 9px; color: #182335; background: #fff; font: inherit; font-size: 1rem; }
    input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 3px solid #b4d6ff; outline-offset: 2px; border-color: #337bd9; }
    .full { grid-column: 1 / -1; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: #173d85; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #0d2c66; }
    .result { display: none; margin-top: 22px; border-top: 1px solid #e8ecf2; padding-top: 20px; }
    .result.visible { display: block; }
    .result-label { margin: 0 0 8px; font-weight: 700; }
    .url { display: block; width: 100%; overflow-wrap: anywhere; background: #f3f6fb; border-radius: 9px; padding: 14px; color: #173d85; font-size: .86rem; line-height: 1.6; text-decoration: none; }
    .url:hover { text-decoration: underline; }
    .status { margin: 10px 0 0; font-size: .85rem; color: #3b6273; }
    @media (max-width: 530px) { .grid { grid-template-columns: 1fr; gap: 16px; } .full { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>HK Express 訂票網址產生器</h1>
      <p class="subtitle">選擇行程，一鍵產生及複製訂票連結。</p>
    </header>
    <section class="panel">
      <form id="booking-form">
        <div class="grid">
          <div class="field">
            <label for="origin">出發機場</label>
            <select id="origin" required></select>
          </div>
          <div class="field">
            <label for="destination">目的地機場</label>
            <select id="destination" required></select>
          </div>
          <div class="field">
            <label for="departure">出發日期</label>
            <input id="departure" type="date" required>
          </div>
          <div class="field">
            <label for="return-date">回程日期</label>
            <input id="return-date" type="date" required>
          </div>
          <div class="field full">
            <label for="adults">成人乘客人數</label>
            <input id="adults" type="number" min="1" max="9" step="1" value="1" required>
          </div>
          <div class="full">
            <button type="submit">產生並複製網址</button>
          </div>
        </div>
      </form>
      <div class="result" id="result" aria-live="polite">
        <p class="result-label">產生的網址</p>
        <a id="generated-url" class="url" target="_blank" rel="noopener noreferrer"></a>
        <p class="status" id="copy-status"></p>
      </div>
    </section>
  </main>
<script>
  'use strict';
  // Keep duplicate BKK labels because both were supplied as choices, despite sharing the same code.
  const stations = [
    ['香港', [['香港', 'HKG']]],
    ['中國大陸', [['北京（大興）','PKX'],['寧波','NGB'],['三亞','SYX']]],
    ['日本', [['福岡','FUK'],['廣島','HIJ'],['鹿兒島','KOJ'],['名古屋','NGO'],['沖繩','OKA'],['大阪（關西）','KIX'],['仙台','SDJ'],['高松','TAK'],['東京（所有機場）','TYO'],['東京（羽田）','HND'],['東京（成田）','NRT']]],
    ['韓國', [['釜山','PUS'],['濟州','CJU'],['首爾（仁川）','ICN']]],
    ['中國台灣', [['花蓮','HUN'],['高雄','KHH'],['台中','RMQ'],['台北','TPE']]],
    ['馬來西亞', [['檳城','PEN']]],
    ['泰國', [['曼谷（所有機場）','BKK'],['曼谷（廊曼）','DMK'],['曼谷（蘇凡納布米）','BKK'],['清邁','CNX'],['布吉','HKT']]],
    ['越南', [['峴港','DAD'],['河內','HAN'],['富國島','PQC']]],
    ['菲律賓', [['克拉克','CRK'],['馬尼拉','MNL']]]
  ];
  for (const id of ['origin','destination']) {
    const select = document.getElementById(id);
    for (const [groupName, airports] of stations) {
      const group = document.createElement('optgroup');
      group.label = groupName;
      for (const [name, code] of airports) {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = `${name} (${code})`;
        group.appendChild(option);
      }
      select.appendChild(group);
    }
  }
  document.getElementById('origin').value = 'HKG';
  document.getElementById('destination').value = 'TPE';
  const departureInput = document.getElementById('departure');
  const returnInput = document.getElementById('return-date');
  departureInput.addEventListener('change', () => {
    returnInput.min = departureInput.value;
    if (returnInput.value && returnInput.value < departureInput.value) returnInput.value = departureInput.value;
  });
  const formatDate = iso => {
    const [year, month, day] = iso.split('-');
    return `${Number(day)}/${Number(month)}/${year}`;
  };
  document.getElementById('booking-form').addEventListener('submit', async event => {
    event.preventDefault();
    const origin = document.getElementById('origin').value;
    const destination = document.getElementById('destination').value;
    const departure = departureInput.value;
    const returning = returnInput.value;
    const adults = Number(document.getElementById('adults').value);
    if (origin === destination) { alert('出發及目的地機場不可相同。'); return; }
    if (!departure || !returning || returning < departure) { alert('請選擇正確的出發及回程日期。'); return; }
    if (!Number.isInteger(adults) || adults < 1 || adults > 9) { alert('成人乘客人數必須為 1 至 9。'); return; }
    const params = new URLSearchParams({
      SearchType: 'RETURN', OriginStation: origin, DestinationStation: destination,
      DepartureDate: formatDate(departure), ReturnDate: formatDate(returning),
      Adults: String(adults), rediscoverbooking: 'false', currency: 'HKD'
    });
    const url = `https://booking.hkexpress.com/zh-hk/select/?${params.toString()}`;
    const link = document.getElementById('generated-url');
    link.href = url;
    link.textContent = url;
    document.getElementById('result').classList.add('visible');
    const status = document.getElementById('copy-status');
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = '✓ 已複製到剪貼簿。點擊網址亦可開啟。';
    } catch (error) {
      // A local file or non-secure context may restrict Clipboard API.
      const field = document.createElement('textarea');
      field.value = url;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_) {}
      field.remove();
      status.textContent = copied ? '✓ 已複製到剪貼簿。' : '瀏覽器未允許自動複製，請長按網址複製。';
    }
  });
</script>
</body>
</html>
